document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lex;gap:20px;padding:10px 18px;border-top:2px solid var(--hair);font-size:12px;color:var(--muted)\"><span>↑↓ выбрать<\u002Fspan><span>Enter открыть<\u002Fspan><span style=\"margin-left:auto\">{{ searchHint }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;posters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведение&quot;},&quot;strictGate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведение&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'lab-redesign-v1';\n  state = { ready: false, at: 'home', last: null, mode: 'steps', theme: 'light', done: {}, quiz: {}, tSess: 0, tTotal: 0, running: false, pop: null, sOpen: false, q: '', sIdx: 0 };\n  scrollRef = React.createRef();\n  searchRef = React.createRef();\n  els = new Map();\n\n  componentDidMount() {\n    const wait = () => (window.LAB ? this.init() : (this.wt = setTimeout(wait, 50)));\n    wait();\n    this.tick = setInterval(() => {\n      if (!this.state.running) return;\n      this.setState(s => ({ tSess: s.tSess + 1, tTotal: s.tTotal + 1 }), () => { if (this.state.tTotal % 5 === 0) this.save(); });\n    }, 1000);\n    this.onKey = e => {\n      const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');\n      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.setState(s => ({ sOpen: !s.sOpen, q: '', sIdx: 0 })); return; }\n      if (e.key === 'Escape') { this.setState({ sOpen: false, pop: null }); return; }\n      if (typing || this.state.sOpen) return;\n      if (e.key === '/') { e.preventDefault(); this.setState({ sOpen: true, q: '', sIdx: 0 }); return; }\n      if (this.state.mode === 'steps' && this.state.at !== 'home') {\n        const seq = this.seq(), i = seq.indexOf(this.state.at);\n        if (e.key === 'ArrowRight' && seq[i + 1]) this.go(seq[i + 1]);\n        if (e.key === 'ArrowLeft' && seq[i - 1]) this.go(seq[i - 1]);\n      }\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.onHash = () => this.goHash();\n    window.addEventListener('hashchange', this.onHash);\n    document.body.dataset.theme = this.state.theme;\n  }\n  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.wt); window.removeEventListener('keydown', this.onKey); window.removeEventListener('hashchange', this.onHash); this.save(); }\n\n  init() {\n    const L = window.LAB; this.L = L; this.U = {}; this.S = {}; this.KEY = 'lab-redesign-v1:' + (L.slug || 'lab'); try { document.title = L.title; } catch (e) {}\n    if (L.accent) this.applyAccent(L.accent);\n    L.units.forEach(u => (this.U[u.key] = u));\n    L.sessions.forEach(s => (this.S[s.n] = s, s.lab = s.code || String(s.n)));\n    this.allKeys = [...L.units.filter(u => u.kind === 'theory'), ...L.units.filter(u => u.kind === 'step'), ...L.units.filter(u => u.kind === 'ref')].map(u => u.key);\n    const gl = { theory: 'Теория', step: 'Шаги', ref: 'Справка' };\n    this.index = L.units.map(u => ({ id: 'u:' + u.key, group: gl[u.kind], num: u.num, title: u.title, t: u.title.toLowerCase(), x: (u.text || '').toLowerCase(), raw: u.text || '' }));\n    ((L.glossKey && this.U[L.glossKey].gloss) || []).forEach(g => this.index.push({ id: 'u:' + L.glossKey, group: 'Глоссарий', num: '', title: g.term, t: g.term.toLowerCase(), x: g.def.toLowerCase(), raw: g.def, gloss: true }));\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) {}\n    const keep = {};\n    ['done', 'quiz', 'last', 'mode', 'theme', 'tSess', 'tTotal'].forEach(k => saved[k] !== undefined && (keep[k] = saved[k]));\n    this.setState({ ready: true, ...keep }, () => this.goHash());\n  }\n  applyAccent(hex) {\n    const toRgb = h => [1, 3, 5].map(i => parse pendingScroll = null; requestAnimationFrame(() => this.scrollToId(id)); }\n    if (this.pendingTop) { this.pendingTop = false; if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; }\n  }\n\n  posters() { return this.props.posters ?? true; }\n  strict() { return this.props.strictGate ?? true; }\n  seq() {\n    const L = this.L, ids = [];\n    L.units.filter(u => u.kind === 'theory').forEach(u => ids.push('u:' + u.key));\n    L.sessions.forEach(s => { if (this.posters()) ids.push('p:' + s.n); s.steps.forEach(k => ids.push('u:' + k)); });\n    L.units.filter(u => u.kind === 'ref').forEach(u => ids.push('u:' + u.key));\n    return ids;\n  }\n  group(id) {\n    if (!id || id === 'home') return null;\n    if (id[0] === 'p') return +id.slice(2);\n    const u = this.U[id.slice(2)];\n    return u.kind === 'step' ? u.session : u.kind === 'theory' ? 'T' : 'R';\n  }\n  gKeys(g) {\n    if (g === 'T') return this.L.units.filter(u => u.kind === 'theory').map(u => u.key);\n    if (g === 'R') return this.L.units.filter(u => u.kind === 'ref').map(u => u.key);\n    return this.S[g].steps;\n  }\n  firstUndone(keys) { return keys.find(k => !this.state.done[k]) || keys[0]; }\n  dom(id) { return 'x-' + id.replace(':', '-'); }\n  go(id) {\n    if (id === 'home') { this.setState({ at: 'home', pop: null, sOpen: false }); return; }\n    if (id[0] === 'p' && !this.posters()) id = 'u:' + this.S[+id.slice(2)].steps[0];\n    if (this.state.mode === 'feed') this.pendingScroll = id; else this.pendingTop = true;\n    this.setState({ at: id, last: id, pop: null, sOpen: false });\n  }\n  goHash() {\n    const h = decodeURIComponent((window.location.hash || '').slice(1));\n    if (h && this.U && this.U[h]) this.go('u:' + h);\n  }\n  scrollToId(id) {\n    const sc = this.scrollRef.current, el = document.getElementById(this.dom(id));\n    if (!sc || !el) return;\n    this.spyLock = true;\n    sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;\n    setTimeout(() => (this.spyLock = false), 150);\n  }\n  spy() {\n    const sc = this.scrollRef.current; if (!sc) return;\n    const top = sc.getBoundingClientRect().top; let cur = null;\n    for (const id of this.seq()) {\n      const el = document.getElementById(this.dom(id)); if (!el) continue;\n      if (el.getBoundingClientRect().top - top <= 140) cur = id; else break;\n    }\n    if (cur && cur !== this.state.at) this.setState({ at: cur, last: cur });\n  }\n  gateOk(key) {\n    if (!this.strict()) return true;\n    const u = this.U[key]; if (!u.quiz || !u.quiz.length) return true;\n    const q = this.state.quiz[key] || [];\n    return u.quiz.every((_, i) => q[i]);\n  }\n  mark(key, v) { this.setState(s => ({ done: { ...s.done, [key]: v } })); }\n  toggleQ(key, i) { this.setState(s => { const q = [...(s.quiz[key] || [])]; q[i] = !q[i]; return { quiz: { ...s.quiz, [key]: q } }; }); }\n  el(k, html, tag) {\n    if (!this.els.has(k)) this.els.set(k, React.createElement(tag || 'div', { key: k, dangerouslySetInnerHTML: { __html: html } }));\n    return this.els.get(k);\n  }\n  fmt(t) { const p = n => String(n).padStart(2, '0'); return `${p(Math.floor(t / 3600))}:${p(Math.floor(t / 60) % 60)}:${p(t % 60)}`; }\n  plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }\n  short(t, n) { return t.length > n ? t.slice(0, n - 1).trim() + '…' : t; }\n  label(id) {\n    if (!id) return '';\n    if (id[0] === 'p') return 'Сессия ' + this.S[+id.slice(2)].lab;\n    const u = this.U[id.slice(2)];\n    return u.num + ' ' + this.short(u.title, 34);\n  }\n\n  vmUnit(id, feed) {\n    if (id[0] === 'p') {\n      const s = this.S[+id.slice(2)], dn = s.steps.filter(k => this.state.done[k]).length;\n      return { isPosterItem: true, isDoc: false, isStep: false, domId: this.dom(id), n: s.lab, nn: String(s.lab).padStart(2, '0'), title: s.title, dur: s.dur, cnt: `${dn} из ${s.steps.length}` };\n    }\n    const key = id.slice(2), u = this.U[key], done = !!this.state.done[key], ok = this.gateOk(key);\n    const base = {\n      isPosterItem: false, domId: this.dom(id), done, showInlineMark: feed,\n      markLabel: done ? '✓ Пройдено — снять отметку' : u.kind === 'step' ? 'Шаг пройден' : 'Раздел прочитан',\n      markDisabled: !done && !ok, onMark: () => this.mark(key, !done),\n      markBg: done ? 'var(--ink)' : ok ? 'var(--color-accent)' : 'var(--hair)',\n      markInk: done ? 'var(--paper)' : ok ? '#fff' : 'var(--muted)',\n      markHint: !done && !ok ? 'Сначала отметьте вопросы «Проверь себя»' : ''\n    };\n    if (u.kind !== 'step') {\n      return { ...base, isDoc: true, isStep: false, num: u.num, title: u.title, kicker: u.kind === 'theory' ? `Теория · раздел ${u.num}` : 'Справка', el: this.el(key, u.html) };\n    }\n    const s = this.S[u.session], idx = s.steps.indexOf(key), q = this.state.quiz[key] || [];\n    const qd = u.quiz.filter((_, i) => q[i]).length;\n    return {\n      ...base, isDoc: false, isStep: true, num: u.num, title: u.title,\n      kicker: `Сессия ${s.lab} · шаг ${idx + 1} из ${s.steps.length}`,\n      introEl: this.el(key + ':i', u.intro),\n      hasResult: !!u.result, resultEl: u.result ? this.el(key + ':r', u.result) : null,\n      hasWhy: !!u.why, whyEl: u.why ? this.el(key + ':w', u.why) : null,\n      hasLinks: !!(u.links && u.links.length), links: (u.links || []).map(l => ({ u: l.u, t: l.t, n: l.n })),\n      deep: u.deep.map((d, i) => ({ summary: d.summary, el: this.el(key + ':d' + i, d.html) })),\n      hasQuiz: u.quiz.length > 0, quizCount: `${qd} из ${u.quiz.length}`,\n      quiz: u.quiz.map((h, i) => ({ el: this.el(key + ':q' + i, h, 'span'), onToggle: () => this.toggleQ(key, i), boxBg: q[i] ? 'var(--ink)' : 'transparent', mark: q[i] ? '✓' : '', ink: q[i] ? 'var(--muted)' : 'var(--ink)' })),\n      hasOutro: !!u.outro, outroLabel: u.outro ? u.outro.label : '', outroEl: u.outro ? this.el(key + ':o', u.outro.html) : null\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    if (!st.ready) return { loading: true, isHome: false, isApp: false, searchOpen: false, theoryCells: [], sessCells: [], refCells: [], rail: [], tabs: [], ticks: [], shown: [], results: [], p: {}, f: {}, scrollRef: this.scrollRef, searchRef: this.searchRef };\n    const L = this.L, seq = this.seq(), feed = st.mode === 'feed', dark = st.theme === 'dark';\n    const doneCount = this.allKeys.filter(k => st.done[k]).length, total = this.allKeys.length;\n    const thU = L.units.filter(u => u.kind === 'theory'), rfU = L.units.filter(u => u.kind === 'ref');\n    const range = a => a.length ? (a.length > 1 ? `разделы ${a[0].num}–${a[a.length - 1].num}` : `раздел ${a[0].num}`) : '';\n    const nextUndone = () => { const k = this.allKeys.find(k => !st.done[k]); return k ? 'u:' + k : seq[0]; };\n    const contId = st.last || nextUndone();\n    const common = {\n      loading: false, isDark: dark, isLight: !dark,\n      totalT: this.fmt(st.tTotal), sessT: this.fmt(st.tSess),\n      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),\n      themeLabel: dark ? 'Светлая тема' : 'Тёмная тема',\n      openSearch: () => this.setState({ sOpen: true, q: '', sIdx: 0 }),\n      goHome: () => this.go('home'),\n      scrollRef: this.scrollRef, searchRef: this.searchRef\n    };\n\n    // search\n    let results = [];\n    if (st.sOpen) {\n      const q = st.q.trim().toLowerCase();\n      if (!q) {\n        results = this.allKeys.filter(k => !st.done[k]).slice(0, 6).map(k => ({ ...this.index.find(e => e.id === 'u:' + k), group: 'Дальше' }));\n      } else {\n        results = this.index.map((e, i) => {\n          let sc = 0;\n          if (e.num && e.num === q) sc = 5; else if (e.num && e.num.startsWith(q)) sc = 4;\n          else if (e.t.includes(q)) sc = 3; else if (e.x.includes(q)) sc = 1;\n          return { e, sc, i };\n        }).filter(r => r.sc).sort((a, b) => b.sc - a.sc || a.i - b.i).slice(0, 12).map(r => {\n          let snip = r.e.gloss ? r.e.raw : '';\n          if (!snip && r.sc === 1) { const p = r.e.x.indexOf(q); snip = (p > 30 ? '…' : '') + r.e.raw.slice(Math.max(0, p - 30), p + 90); }\n          return { ...r.e, snip };\n        });\n      }\n    }\n    const sIdx = Math.min(st.sIdx, Math.max(0, results.length - 1));\n    const searchVals = {\n      searchOpen: st.sOpen, q: st.q, noResults: st.sOpen && !results.length,\n      searchHint: st.q.trim() ? `${results.length} ${this.plural(results.length, 'результат', 'результата', 'результатов')}` : 'Следующие непройденные',\n      onQ: e => this.setState({ q: e.target.value, sIdx: 0 }),\n      onSearchKey: e => {\n        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ sIdx: Math.min(sIdx + 1, results.length - 1) }); }\n        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sIdx: Math.max(sIdx - 1, 0) }); }\n        else if (e.key === 'Enter' && results[sIdx]) this.go(results[sIdx].id);\n        else if (e.key === 'Escape') this.setState({ sOpen: false });\n      },\n      closeSearch: () => this.setState({ sOpen: false }),\n      stop: e => e.stopPropagation(),\n      results: results.map((r, i) => ({\n        group: r.group, num: r.num, title: r.title, snip: r.snip || '',\n        bg: i === sIdx ? 'var(--ink)' : 'transparent', ink: i === sIdx ? 'var(--paper)' : 'var(--ink)',\n        onClick: () => this.go(r.id), onHover: () => i !== sIdx && this.setState({ sIdx: i })\n      }))\n    };\n\n    if (st.at === 'home') {\n      const cell = (u) => {\n        const d = !!st.done[u.key];\n        return { num: u.num, title: u.title, mark: d ? '✓' : '', bg: 'transparent', numInk: d ? 'var(--muted)' : 'var(--ink)', onClick: () => this.go('u:' + u.key) };\n      };\n      const th = L.units.filter(u => u.kind === 'theory'), rf = L.units.filter(u => u.kind === 'ref');\n      const stepsDone = L.sessions.reduce((a, s) => a + s.steps.filter(k => st.done[k]).length, 0);\n      const curG = this.group(contId);\n      return {\n        ...common, ...searchVals, isHome: true, isApp: false,\n        doneCount, totalCount: total, donePct: Math.round(doneCount / total * 100) + '%',\n        labTitle: L.title, hasIntro: !!L.introHtml, introEl: L.introHtml ? this.el('intro', L.introHtml) : null,\n        theoryRange: range(thU), refRange: range(rfU),\n        sessLabel: `${L.sessions.length} ${this.plural(L.sessions.length, 'сессия', 'сессии', 'сессий')}`,\n        continueKicker: doneCount || st.last ? 'Продолжить' : 'Начать',\n        continueLabel: this.label(contId),\n        onContinue: () => this.go(contId),\n        subtitle: L.subtitle, tocEl: this.el('toc', L.tocHtml),\n        theoryCnt: `${th.filter(u => st.done[u.key]).length} из ${th.length}`,\n        stepsCnt: `${stepsDone} из ${L.sessions.reduce((a, s) => a + s.steps.length, 0)} шагов`,\n        theoryCells: th.map(cell), refCells: rf.map(cell),\n        sessCells: L.sessions.map(s => {\n          const dn = s.steps.filter(k => st.done[k]).length, cur = curG === s.n;\n          return {\n            nn: String(s.lab).padStart(2, '0'), title: s.title, dur: s.dur,\n            cnt: dn === s.steps.length ? 'Сессия пройдена' : `${dn} из ${s.steps.length} ${this.plural(s.steps.length, 'шага', 'шагов', 'шагов')}`,\n            bg: cur ? 'var(--fill)' : 'transparent',\n            numInk: cur ? 'var(--color-accent)' : dn === s.steps.length ? 'var(--ink)' : 'var(--faint)',\n            bars: s.steps.map(k => ({ c: st.done[k] ? 'var(--ink)' : 'var(--hair)' })),\n            onClick: () => this.go(this.posters() ? 'p:' + s.n : 'u:' + this.firstUndone(s.steps))\n          };\n        }),\n        resetAll: () => { if (confirm('Сбросить весь прогресс, ответы и таймеры?')) this.setState({ done: {}, quiz: {}, tSess: 0, tTotal: 0, running: false, last: null }); }\n      };\n    }\n\n    const at = st.at, curG = this.group(at), atKey = at[0] === 'u' ? at.slice(2) : null;\n    const groups = [{ id: 'T', label: 'Т' }, ...L.sessions.map(s => ({ id: s.n, label: String(s.lab) })), { id: 'R', label: 'С' }].filter(g => this.gKeys(g.id).length);\n    const rail = groups.map((g, gi) => {\n      const keys = this.gKeys(g.id), dn = keys.filter(k => st.done[k]).length, all = dn === keys.length, cur = curG === g.id;\n      const s = typeof g.id === 'number' ? this.S[g.id] : null;\n      return {\n        label: g.label,\n        bg: cur ? 'var(--color-accent)' : all ? 'var(--ink)' : 'transparent',\n        ink: cur ? '#fff' : all ? 'var(--paper)' : 'var(--ink)',\n        border: cur ? 'var(--color-accent)' : all ? 'var(--ink)' : 'var(--muted)',\n        pct: Math.round(dn / keys.length * 100) + '%', barC: cur ? 'var(--color-accent)' : 'var(--ink)',\n        popOpen: st.pop === g.id, popTop: gi < 7 ? '0' : 'auto', popBottom: gi < 7 ? 'auto' : '0',\n        popKicker: g.id === 'T' ? `Теория · ${dn} из ${keys.length}` : g.id === 'R' ? `Справка · ${dn} из ${keys.length}` : `Сессия ${s.lab} · ${s.dur} · ${dn} из ${keys.length}`,\n        popTitle: g.id === 'T' ? 'Теория' : g.id === 'R' ? 'Справка' : s.title,\n        items: keys.map(k => {\n          const u = this.U[k], d = !!st.done[k], c = k === atKey;\n          return { num: u.num, title: u.title, mark: d ? '✓' : '', bg: c ? 'var(--accent-fill)' : 'transparent', ink: c ? 'var(--accent-ink)' : d ? 'var(--muted)' : 'var(--ink)', fw: c ? 800 : 400, onClick: () => this.go('u:' + k) };\n        }),\n        onEnter: e => {\n          clearTimeout(this.popT);\n          const r = e.currentTarget.getBoundingClientRect(), low = r.top > window.innerHeight / 2;\n          this.popPos = low ? { top: 'auto', bottom: Math.max(8, window.innerHeight - r.bottom) + 'px' } : { top: r.top + 'px', bottom: 'auto' };\n          if (st.pop !== g.id) this.setState({ pop: g.id });\n        },\n        onLeave: () => { clearTimeout(this.popT); this.popT = setTimeout(() => this.setState({ pop: null }), 160); },\n        onClick: () => this.go(s ? (this.posters() && !dn ? 'p:' + s.n : 'u:' + this.firstUndone(keys)) : 'u:' + this.firstUndone(keys))\n      };\n    });\n    const gk = this.gKeys(curG);\n    const tabs = [];\n    if (typeof curG === 'number' && this.posters()) tabs.push({ id: 'p:' + curG, label: 'Обзор', tip: 'Начало сессии' });\n    gk.forEach(k => tabs.push({ id: 'u:' + k, label: this.U[k].num, tip: this.U[k].title, key: k }));\n    const sCur = typeof curG === 'number' ? this.S[curG] : null;\n    const isPosterView = !feed && at[0] === 'p';\n    const shownIds = feed ? seq : isPosterView ? [] : [at];\n    const shown = shownIds.map(id => this.vmUnit(id, feed));\n\n    let f = {}, showFooter = false;\n    if (!feed && atKey) {\n      showFooter = true;\n      const u = this.U[atKey], i = seq.indexOf(at), prev = seq[i - 1], next = seq[i + 1];\n      const done = !!st.done[atKey], ok = this.gateOk(atKey), q = st.quiz[atKey] || [];\n      const qd = u.quiz ? u.quiz.filter((_, j) => q[j]).length : 0;\n      const isStep = u.kind === 'step';\n      f = {\n        hasPrev: !!prev, prevLabel: this.label(prev), onPrev: () => this.go(prev),\n        hint: done ? (isStep ? 'Шаг пройден' : 'Раздел прочитан') : !ok ? `Отметьте «Проверь себя» (${qd} из ${u.quiz.length}), чтобы закрыть шаг` : '',\n        unmarkShow: done, onUnmark: () => this.mark(atKey, false),\n        skipShow: !done && !!next, onSkip: () => this.go(next),\n        primaryLabel: done ? (next ? `Дальше: ${this.label(next)} →` : 'На главную →') : (isStep ? 'Шаг пройден' : 'Прочитано') + (next ? ', дальше →' : ''),\n        primaryDisabled: !done && !ok,\n        primaryBg: !done && !ok ? 'var(--hair)' : 'var(--color-accent)',\n        primaryInk: !done && !ok ? 'var(--muted)' : '#fff',\n        cursor: !done && !ok ? 'not-allowed' : 'pointer',\n        onPrimary: () => { if (!done) { if (!ok) return; this.mark(atKey, true); } this.go(next || 'home'); }\n      };\n    }\n    let p = {};\n    if (isPosterView) {\n      const s = this.S[+at.slice(2)], dn = s.steps.filter(k => st.done[k]).length, fu = this.firstUndone(s.steps);\n      p = {\n        n: s.lab, nn: String(s.lab).padStart(2, '0'), title: s.title, dur: s.dur,\n        count: `${s.steps.length} ${this.plural(s.steps.length, 'шаг', 'шага', 'шагов')} · ${dn} ${this.plural(dn, 'пройден', 'пройдено', 'пройдено')}`,\n        startLabel: dn === 0 ? `Начать с ${this.U[fu].num} →` : dn === s.steps.length ? 'Повторить с начала →' : `Продолжить с ${this.U[fu].num} →`,\n        onStart: () => this.go('u:' + (dn === s.steps.length ? s.steps[0] : fu)),\n        steps: s.steps.map(k => ({ num: this.U[k].num, title: this.U[k].title, mark: st.done[k] ? '✓' : '', onClick: () => this.go('u:' + k) }))\n      };\n    }\n    return {\n      ...common, ...searchVals, isHome: false, isApp: true, rail,\n      popTop: (this.popPos || {}).top || '0', popBottom: (this.popPos || {}).bottom || 'auto',\n      ticks: this.allKeys.map(k => ({ c: k === atKey ? 'var(--color-accent)' : st.done[k] ? 'var(--ink)' : 'var(--hair)' })),\n      groupKicker: curG === 'T' ? 'Теория · ' + range(thU) : curG === 'R' ? 'Справка · ' + range(rfU) : `Сессия ${sCur.lab} · ${sCur.dur}`,\n      groupTitle: sCur ? sCur.title : atKey ? this.U[atKey].title : '',\n      tabs: tabs.map(t => {\n        const c = t.id === at, d = t.key && st.done[t.key];\n        return { label: t.label, tip: t.tip, mark: d ? '✓' : '', under: c ? 'var(--color-accent)' : 'transparent', ink: c ? 'var(--ink)' : d ? 'var(--muted)' : 'var(--ink)', fw: c ? 800 : 400, onClick: () => this.go(t.id) };\n      }),\n      feedBg: feed ? 'var(--ink)' : 'transparent', feedInk: feed ? 'var(--paper)' : 'var(--ink)',\n      stepsBg: !feed ? 'var(--ink)' : 'transparent', stepsInk: !feed ? 'var(--paper)' : 'var(--ink)',\n      setFeed: () => { if (!feed) { this.pendingScroll = at; this.setState({ mode: 'feed' }); } },\n      setSteps: () => { if (feed) { this.pendingTop = true; this.setState({ mode: 'steps' }); } },\n      timerLabel: st.running ? 'Пауза' : st.tSess ? 'Продолжить' : 'Старт',\n      timerBg: st.running ? 'var(--color-accent)' : 'var(--ink)', timerInk: st.running ? '#fff' : 'var(--paper)',\n      toggleTimer: () => this.setState({ running: !st.running }, () => this.save()),\n      resetSess: () => this.setState({ tSess: 0 }, () => this.save()),\n      onScroll: () => { if (!feed || this.spyLock || this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = null; this.spy(); }); },\n      onContentClick: e => {\n        const a = e.target.closest && e.target.closest('a'); if (!a) return;\n        const h = a.getAttribute('href') || ''; if (!h.startsWith('#')) return;\n        e.preventDefault();\n        const id = h.slice(1); let m;\n        if (/^(step-|sec-)/.test(id) && this.U[id]) this.go('u:' + id);\n        else if ((m = id.match(/^session-(\\d+)/))) this.go('p:' + m[1]);\n        else if (/^(g-|term-)/.test(id) && L.glossKey) this.go('u:' + L.glossKey);\n        else if (id === 'top') this.go('home');\n      },\n      isPosterView, p, shown, showFooter, f\n    };\n  }\n}\n<\u002Fscript>\n\n\n<script src=\"https://anitech.meeymirita.ru/works/js/prereq.js\"><\u002Fscript><script src=\"https://anitech.meeymirita.ru/works/js/sync.js\"><\u002Fscript><\u002Fbody><\u002Fhtml>"
